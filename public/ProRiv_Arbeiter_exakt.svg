<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (Warm Orange / Amber) -->
    <linearGradient id="worker-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Clip path to keep torso within circle -->
    <clipPath id="worker-clip">
      <circle cx="60" cy="60" r="54" />
    </clipPath>

    <!-- Skin Tones -->
    <radialGradient id="worker-face" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fbd5c0" />
      <stop offset="50%" stop-color="#f1ba9a" />
      <stop offset="100%" stop-color="#d97757" />
    </radialGradient>
    <linearGradient id="worker-neck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1ba9a" />
      <stop offset="100%" stop-color="#c45e3d" />
    </linearGradient>

    <!-- Yellow Safety Helmet Gradients -->
    <linearGradient id="helmet-yellow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="yellow-ridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Work Bib (Latzhose) Orange Gradient -->
    <linearGradient id="bib-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Badge Orange Gradient -->
    <linearGradient id="badge-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="60" cy="60" r="56" fill="url(#worker-bg)" stroke="#fb923c" stroke-width="3.5" />
  <!-- Dotted Inner Ring -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="#fed7aa" stroke-width="0.8" stroke-dasharray="2.5 2" opacity="0.75" />

  <!-- Avatar Character (Clipped) -->
  <g clip-path="url(#worker-clip)">
    <!-- Base Torso / Dark Charcoal Work T-Shirt -->
    <path d="M16 120 C16 92 25 78 40 73 L80 73 C95 78 104 92 104 120 Z" fill="#1e293b" />

    <!-- Neck & Crewneck Collar -->
    <path d="M48 50 H72 V74 C72 78 68 83 60 83 C52 83 48 78 48 74 Z" fill="url(#worker-neck)" />
    <!-- T-shirt Crewneck Collar Line -->
    <path d="M46 72 C52 79 68 79 74 72 L77 78 C70 86 50 86 43 78 Z" fill="#0f172a" />

    <!-- Orange Work Overalls (Latzhose) -->
    <!-- Left Shoulder Strap -->
    <rect x="36" y="73" width="9.5" height="47" fill="url(#bib-grad)" rx="1.5" />
    <!-- Right Shoulder Strap -->
    <rect x="74.5" y="73" width="9.5" height="47" fill="url(#bib-grad)" rx="1.5" />

    <!-- Metal Strap Buckles/Clips -->
    <g fill="#cbd5e1" stroke="#475569" stroke-width="0.8">
      <rect x="35" y="87" width="11.5" height="6" rx="1.5" />
      <rect x="73.5" y="87" width="11.5" height="6" rx="1.5" />
      <circle cx="40.7" cy="90" r="1.2" fill="#334155" />
      <circle cx="79.2" cy="90" r="1.2" fill="#334155" />
    </g>

    <!-- Center Bib Panel -->
    <path d="M41 93 H79 V120 H41 Z" fill="url(#bib-grad)" />
    <!-- Front Pocket Horizontal Seam -->
    <line x1="46" y1="102" x2="74" y2="102" stroke="#9a3412" stroke-width="1.4" stroke-linecap="round" />

    <!-- Ears -->
    <ellipse cx="43" cy="51" rx="3.2" ry="5.5" fill="#f1ba9a" stroke="#d97757" stroke-width="0.6" />
    <ellipse cx="77" cy="51" rx="3.2" ry="5.5" fill="#f1ba9a" stroke="#d97757" stroke-width="0.6" />

    <!-- Dark Hair under helmet -->
    <path d="M41 44 C41 53 44 57 46 57 C48 57 47 48 45 44 Z" fill="#1e293b" />
    <path d="M79 44 C79 53 76 57 74 57 C72 57 73 48 75 44 Z" fill="#1e293b" />

    <!-- Faceless 3D Head -->
    <path d="M44 43 C44 56 48 67 60 67 C72 67 76 56 76 43 C76 38 72 35 60 35 C48 35 44 38 44 43 Z" fill="url(#worker-face)" />

    <!-- 3D Yellow Safety Helmet -->
    <!-- Dome -->
    <path d="M38 39 C38 21 47 15 60 15 C73 15 82 21 82 39 Z" fill="url(#helmet-yellow)" />
    <!-- Helmet Central Crest / Raised Ridge -->
    <path d="M56.5 15 C57.5 14 62.5 14 63.5 15 L64.5 39 C64.5 40 63.5 41 60 41 C56.5 41 55.5 40 55.5 39 Z" fill="url(#yellow-ridge)" />
    <!-- Front Brim -->
    <path d="M35 39 C35 36.5 42 35.5 60 35.5 C78 35.5 85 36.5 85 39 C85 41.5 78 42.5 60 42.5 C42 42.5 35 41.5 35 39 Z" fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />
  </g>

  <!-- Overlapping Bottom-Right Tools Badge -->
  <!-- Shadow -->
  <circle cx="91.5" cy="91.5" r="23" fill="#000000" opacity="0.25" />
  <!-- Thick White Rim -->
  <circle cx="90" cy="90" r="23" fill="#ffffff" />
  <!-- Inner Orange Circle -->
  <circle cx="90" cy="90" r="19.5" fill="url(#badge-orange)" />

  <!-- Crossed White Wrenches -->
  <g transform="translate(90 90)">
    <!-- Wrench 1 (diagonal \) -->
    <g transform="rotate(45)">
      <!-- Shaft -->
      <rect x="-2.2" y="-10" width="4.4" height="20" rx="1.5" fill="#ffffff" />
      <!-- Top Open Jaw -->
      <path d="M-5.5 -9.5 C-5.5 -13.5 -2.5 -15 0 -15 C2.5 -15 5.5 -13.5 5.5 -9.5 C5.5 -8 4 -7 2.2 -6.5 V-5.5 H-2.2 V-6.5 C-4 -7 -5.5 -8 -5.5 -9.5 Z" fill="#ffffff" />
      <polygon points="-2.2,-15 0,-11.5 2.2,-15" fill="url(#badge-orange)" />
      <!-- Bottom Open Jaw -->
      <path d="M-5.5 9.5 C-5.5 13.5 -2.5 15 0 15 C2.5 15 5.5 13.5 5.5 9.5 C5.5 8 4 7 2.2 6.5 V5.5 H-2.2 V6.5 C-4 7 -5.5 8 -5.5 9.5 Z" fill="#ffffff" />
      <polygon points="-2.2,15 0,11.5 2.2,15" fill="url(#badge-orange)" />
    </g>

    <!-- Wrench 2 (diagonal /) -->
    <g transform="rotate(-45)">
      <!-- Shaft -->
      <rect x="-2.2" y="-10" width="4.4" height="20" rx="1.5" fill="#ffffff" />
      <!-- Top Open Jaw -->
      <path d="M-5.5 -9.5 C-5.5 -13.5 -2.5 -15 0 -15 C2.5 -15 5.5 -13.5 5.5 -9.5 C5.5 -8 4 -7 2.2 -6.5 V-5.5 H-2.2 V-6.5 C-4 -7 -5.5 -8 -5.5 -9.5 Z" fill="#ffffff" />
      <polygon points="-2.2,-15 0,-11.5 2.2,-15" fill="url(#badge-orange)" />
      <!-- Bottom Open Jaw -->
      <path d="M-5.5 9.5 C-5.5 13.5 -2.5 15 0 15 C2.5 15 5.5 13.5 5.5 9.5 C5.5 8 4 7 2.2 6.5 V5.5 H-2.2 V6.5 C-4 7 -5.5 8 -5.5 9.5 Z" fill="#ffffff" />
      <polygon points="-2.2,15 0,11.5 2.2,15" fill="url(#badge-orange)" />
    </g>
  </g>
</svg>
