<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (Teal / Emerald) -->
    <linearGradient id="foreman-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Clip path to keep torso within circle -->
    <clipPath id="foreman-clip">
      <circle cx="60" cy="60" r="54" />
    </clipPath>

    <!-- Skin Tones -->
    <radialGradient id="skin-face" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fbd5c0" />
      <stop offset="50%" stop-color="#f1ba9a" />
      <stop offset="100%" stop-color="#d97757" />
    </radialGradient>
    <linearGradient id="skin-neck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1ba9a" />
      <stop offset="100%" stop-color="#c45e3d" />
    </linearGradient>

    <!-- White Safety Helmet Gradients -->
    <linearGradient id="helmet-white" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="helmet-ridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- High-Vis Vest Gradient -->
    <linearGradient id="vest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Badge Teal Gradient -->
    <linearGradient id="badge-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="60" cy="60" r="56" fill="url(#foreman-bg)" stroke="#2dd4bf" stroke-width="3.5" />
  <!-- Dotted Inner Ring -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="#a7f3d0" stroke-width="0.8" stroke-dasharray="2.5 2" opacity="0.75" />

  <!-- Avatar Character (Clipped) -->
  <g clip-path="url(#foreman-clip)">
    <!-- Base Torso / Dark Polo Base -->
    <path d="M16 120 C16 92 25 78 40 73 L80 73 C95 78 104 92 104 120 Z" fill="#1e293b" />

    <!-- High-Vis Safety Vest -->
    <path d="M26 120 C27 88 36 76 45 72 L75 72 C84 76 93 88 94 120 Z" fill="url(#vest-grad)" />

    <!-- Silver Reflective Stripes -->
    <!-- Left vertical band -->
    <rect x="33" y="73" width="8" height="47" fill="#f8fafc" opacity="0.92" />
    <!-- Right vertical band -->
    <rect x="79" y="73" width="8" height="47" fill="#f8fafc" opacity="0.92" />
    <!-- Lower horizontal band -->
    <rect x="25" y="103" width="70" height="7" fill="#f8fafc" opacity="0.92" />

    <!-- Neck & Dark Polo Shirt Collar -->
    <path d="M48 50 H72 V74 C72 78 68 83 60 83 C52 83 48 78 48 74 Z" fill="url(#skin-neck)" />
    <!-- Navy Polo V-Neck & Collar -->
    <path d="M46 70 L60 84 L74 70 L69 68 L60 77 L51 68 Z" fill="#0f172a" />
    <path d="M45 68 L53 78 L51 86 L43 73 Z" fill="#1e293b" />
    <path d="M75 68 L67 78 L69 86 L77 73 Z" fill="#334155" />
    <line x1="60" y1="84" x2="60" y2="120" stroke="#0f172a" stroke-width="1.8" />

    <!-- Ears -->
    <ellipse cx="43" cy="51" rx="3.2" ry="5.5" fill="#f1ba9a" stroke="#d97757" stroke-width="0.6" />
    <ellipse cx="77" cy="51" rx="3.2" ry="5.5" fill="#f1ba9a" stroke="#d97757" stroke-width="0.6" />

    <!-- Dark Hair under helmet -->
    <path d="M41 44 C41 53 44 57 46 57 C48 57 47 48 45 44 Z" fill="#1e293b" />
    <path d="M79 44 C79 53 76 57 74 57 C72 57 73 48 75 44 Z" fill="#1e293b" />

    <!-- Faceless 3D Head -->
    <path d="M44 43 C44 56 48 67 60 67 C72 67 76 56 76 43 C76 38 72 35 60 35 C48 35 44 38 44 43 Z" fill="url(#skin-face)" />

    <!-- 3D White Safety Helmet -->
    <!-- Dome -->
    <path d="M38 39 C38 21 47 15 60 15 C73 15 82 21 82 39 Z" fill="url(#helmet-white)" />
    <!-- Helmet Central Crest / Raised Ridge -->
    <path d="M56.5 15 C57.5 14 62.5 14 63.5 15 L64.5 39 C64.5 40 63.5 41 60 41 C56.5 41 55.5 40 55.5 39 Z" fill="url(#helmet-ridge)" />
    <!-- Front Brim -->
    <path d="M35 39 C35 36.5 42 35.5 60 35.5 C78 35.5 85 36.5 85 39 C85 41.5 78 42.5 60 42.5 C42 42.5 35 41.5 35 39 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Overlapping Bottom-Right Checklist Badge -->
  <!-- Shadow -->
  <circle cx="91.5" cy="91.5" r="23" fill="#000000" opacity="0.25" />
  <!-- Thick White Rim -->
  <circle cx="90" cy="90" r="23" fill="#ffffff" />
  <!-- Inner Teal Circle -->
  <circle cx="90" cy="90" r="19.5" fill="url(#badge-teal)" />

  <!-- White Clipboard with Green Checkmark -->
  <g transform="translate(90 90)">
    <!-- Clipboard Board -->
    <rect x="-10" y="-10" width="20" height="23" rx="3.2" fill="#ffffff" />
    <!-- Top Clip -->
    <rect x="-3.5" y="-12.5" width="7" height="4" rx="1.5" fill="#cbd5e1" />
    <rect x="-2" y="-13.5" width="4" height="2" rx="0.8" fill="#94a3b8" />
    <!-- Checklist Green Checkmark -->
    <path d="M-5.5 1.5 L-1.5 5.5 L6 -3" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
